name: validation

on: [push, pull_request, workflow_dispatch]

jobs:
  versions:
    uses: ./.github/workflows/ocaml-versions.yml

  core:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.images_matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
      - id: devcontainer
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        env:
          OCAML_VERSION: ${{ matrix.ocaml_version }}
        with:
          variant: ${{ matrix.ocaml_version }}
          platform: ${{ matrix.platform }}
          username: ${{ github.actor }}
          password: ''
      - name: core validation
        run: ${{ steps.devcontainer.outputs.exec }} make build test-core test-melange-optin bench-check fmt-check
      - name: OCaml 5 multicore validation
        if: startsWith(matrix.ocaml_version, '5.')
        run: ${{ steps.devcontainer.outputs.exec }} make test-multicore

  features:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.features_matrix) }}
    name: ${{ matrix.feature }} (${{ matrix.ocaml_version }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7
      - id: devcontainer
        uses: TheCBaH/devcontainer-action/devcontainer@v1
        env:
          OCAML_VERSION: ${{ matrix.ocaml_version }}
        with:
          name: ${{ matrix.name }}
          config: ${{ matrix.config }}
          variant: ${{ matrix.ocaml_version }}
          platform: ${{ matrix.platform }}
          username: ${{ github.actor }}
          password: ''
      - name: native adapter conformance
        if: matrix.feature == 'native-adapters'
        run: >-
          ${{ steps.devcontainer.outputs.exec }} make
          test-base-async test-lwt test-rresult test-cmdliner test-mirage
          test-fmt-logs-yojson test-compiler-locations
      - name: JavaScript adapter conformance
        if: matrix.feature == 'javascript'
        run: ${{ steps.devcontainer.outputs.exec }} make test-js test-melange
      - name: Octez adapter conformance
        if: matrix.feature == 'octez'
        run: ${{ steps.devcontainer.outputs.exec }} make test-octez
